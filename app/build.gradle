plugins { id 'com.android.application' }
android {
    namespace 'com.hamse.tool'
    compileSdk 34
    defaultConfig { applicationId 'com.hamse.tool'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
